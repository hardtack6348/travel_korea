spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PW}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 180000  # 30 * 60 * 100 == 3분
  security:
    security:
      oauth2:
        client:
          registration:
            Kakao:
              client-id: "카카오_디벨로퍼스에서_발급받은_REST_API_키"
              client-secret: "카카오_디벨로퍼스에서_발급받은_Client_Secret_보안_키(필수아님)"
              client-authentication-method: client_secret_post
              authorization-grant-type: authorization_code
              redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
              scope:
                - profile_nickname
                - account_email
              client-name: Kakao
          provider:
            Kakao:
              authorization-uri: https://kakao.com
              token-uri: https://kakao.com
              user-info-uri: https://kakao.com
              user-name-attribute: id
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
#    url: ${secrets.DB_URL}
#    username: ${secrets.DB_USER}
#    password: ${secrets.DB_PW}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  application:
    name: travel_korea
server:
  port: 8080
jwt:
  secret: QfvEunKI05ZNTFi11wTvArkScyZF1r8/vHxs7Tj8xxI=
  access-expiration: 1800000       # 30분 (1000 * 60 * 30)
  refresh-expiration: 604800000    # 7일 (1000 * 60 * 60 * 24 * 7)
